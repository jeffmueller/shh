# shh - shh.example.com
# Self-destructing secret sharing. Privacy-focused: no access logging by default,
# strict rate limits, robots blocked.

# ─── Bot detection ───────────────────────────────────────────────────────
map $http_user_agent $is_bot {
    default 0;

    ~*googlebot           1;
    ~*bingbot             1;
    ~*yandexbot           1;
    ~*baiduspider         1;
    ~*duckduckbot         1;
    ~*slurp               1;

    ~*gptbot              1;
    ~*chatgpt             1;
    ~*ccbot               1;
    ~*anthropic           1;
    ~*claude              1;
    ~*perplexity          1;
    ~*bytespider          1;
    ~*amazonbot           1;
    ~*facebookbot         1;
    ~*meta-externalagent  1;
    ~*applebot            1;
    ~*cohere-ai           1;

    ~*semrush             1;
    ~*ahrefs              1;
    ~*mj12bot             1;
    ~*dotbot              1;
    ~*petalbot            1;
    ~*megaindex           1;
    ~*blexbot             1;
    ~*dataforseo          1;
    ~*serpstatbot         1;
    ~*zoominfobot         1;

    ~*scrapy              1;
    ~*nikto               1;
    ~*sqlmap              1;
    ~*nmap                1;
    ~*masscan             1;
    ~*zgrab               1;
    ~*nuclei              1;
    ~*httpx               1;

    ""                    1;
}

# ─── Rate limiting zones ─────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=shh_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shh_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=shh_assets:10m rate=50r/s;

limit_conn_zone $binary_remote_addr zone=shh_perip:10m;

upstream shh_backend {
    server 127.0.0.1:3011;
    keepalive 16;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name shh.example.com;

    access_log off;
    error_log /var/log/nginx/shh-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name shh.example.com;

    # Privacy: don't log secret URLs to access log.
    access_log off;
    error_log /var/log/nginx/shh-error.log warn;

    ssl_certificate /etc/letsencrypt/live/shh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shh.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    if ($is_bot) {
        return 444;
    }

    limit_conn shh_perip 10;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    # Plaintext cap is 100 KB at the app layer; allow a bit of headroom for JSON envelope.
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    # CSP/Referrer/X-Frame headers are emitted by Next.js (next.config.ts).

    if ($request_method !~ ^(GET|HEAD|OPTIONS|POST)$) {
        return 405;
    }

    location ~* /(wp-admin|wp-login|wp-content|wordpress|xmlrpc\.php|phpmyadmin|pma) {
        deny all;
        return 444;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        deny all;
        return 444;
    }

    location ~* (\.bak|\.backup|\.old|\.env|\.git|\.svn|\.sql)$ {
        deny all;
        return 444;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # ─── API routes ──────────────────────────────────────────────────────
    location /api {
        limit_req zone=shh_api burst=10 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Static assets ───────────────────────────────────────────────────
    location /_next/static {
        limit_req zone=shh_assets burst=30 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        proxy_pass http://shh_backend;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Secret view + create result pages — no caching anywhere ─────────
    location ~ ^/(s|created)/ {
        limit_req zone=shh_general burst=20 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Everything else — Next.js ───────────────────────────────────────
    location / {
        limit_req zone=shh_general burst=20 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
