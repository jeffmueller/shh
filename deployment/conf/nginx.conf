# shh - __DOMAIN_NAME__
# Self-destructing secret sharing. Privacy-focused: no access logging by default,
# strict rate limits, robots blocked.

# ─── Bot detection ───────────────────────────────────────────────────────
map $http_user_agent $is_bot {
    default 0;

    ~*googlebot           1;
    ~*bingbot             1;
    ~*yandexbot           1;
    ~*baiduspider         1;
    ~*duckduckbot         1;
    ~*slurp               1;

    ~*gptbot              1;
    ~*chatgpt             1;
    ~*ccbot               1;
    ~*anthropic           1;
    ~*claude              1;
    ~*perplexity          1;
    ~*bytespider          1;
    ~*amazonbot           1;
    ~*facebookbot         1;
    ~*meta-externalagent  1;
    ~*applebot            1;
    ~*cohere-ai           1;

    ~*semrush             1;
    ~*ahrefs              1;
    ~*mj12bot             1;
    ~*dotbot              1;
    ~*petalbot            1;
    ~*megaindex           1;
    ~*blexbot             1;
    ~*dataforseo          1;
    ~*serpstatbot         1;
    ~*zoominfobot         1;

    ~*scrapy              1;
    ~*nikto               1;
    ~*sqlmap              1;
    ~*nmap                1;
    ~*masscan             1;
    ~*zgrab               1;
    ~*nuclei              1;
    ~*httpx               1;

    ""                    1;
}

# ─── Rate limiting zones ─────────────────────────────────────────────────
# Keyed on client IP. These apply ONLY to dynamic routes (HTML/API) below.
# Immutable /_next/static assets are intentionally left OUT of every rate
# limit: a cold page load fires a burst of hashed-asset requests, and
# throttling that burst made nginx answer the overflow with 503 on a user's
# first visit. The page then "worked on refresh" only because those assets
# were already in the browser cache and weren't re-requested.
limit_req_zone $binary_remote_addr zone=shh_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=shh_api:10m rate=5r/s;

limit_conn_zone $binary_remote_addr zone=shh_perip:10m;

upstream shh_backend {
    server 127.0.0.1:3011;
    keepalive 16;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name __DOMAIN_NAME__;

    access_log off;
    error_log /var/log/nginx/shh-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN_NAME__;

    # Privacy: don't log secret URLs to access log.
    access_log off;
    error_log /var/log/nginx/shh-error.log warn;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    if ($is_bot) {
        return 444;
    }

    # Per-IP connection cap. Generous so a browser's asset-connection fan-out
    # (and several users behind one NAT/CGNAT IP) can't be throttled to 503.
    limit_conn shh_perip 64;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    # Plaintext cap is 100 KB at the app layer; allow a bit of headroom for JSON envelope.
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    # CSP/Referrer/X-Frame headers are emitted by Next.js (next.config.ts).

    if ($request_method !~ ^(GET|HEAD|OPTIONS|POST)$) {
        return 405;
    }

    location ~* /(wp-admin|wp-login|wp-content|wordpress|xmlrpc\.php|phpmyadmin|pma) {
        deny all;
        return 444;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        deny all;
        return 444;
    }

    location ~* (\.bak|\.backup|\.old|\.env|\.git|\.svn|\.sql)$ {
        deny all;
        return 444;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # ─── API routes ──────────────────────────────────────────────────────
    location /api {
        limit_req zone=shh_api burst=10 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Static assets ───────────────────────────────────────────────────
    # Content-hash-named and immutable. Served straight from disk by nginx so
    # the burst of chunk requests on a cold page load never touches the
    # single-threaded Node process on the Pi. Deliberately NOT rate-limited
    # (no limit_req) so that burst can't be rejected with 503.
    #
    # __PI_USER__ is substituted by deploy.sh / setup-pi.sh from PI_USER when
    # the config is uploaded, so this path matches the deploy layout
    # (/home/<PI_USER>/shh/app/.next/static). If a file isn't found there
    # (wrong path, mid-deploy swap, etc.) try_files falls back to proxying
    # Next.js, so asset delivery degrades gracefully instead of breaking.
    # nginx (www-data) must be able to read the path; it's added to the deploy
    # user's group (setup-pi.sh / deploy.sh --update-nginx) and deploy.sh sets
    # group read/traverse on the asset tree on each deploy.
    location /_next/static/ {
        alias /home/__PI_USER__/shh/app/.next/static/;
        try_files $uri @next_static_proxy;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fallback for the above: serve /_next/static from Next.js when the file
    # can't be served from disk.
    location @next_static_proxy {
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The app ships app/icon.svg (linked from <head>); there is no favicon.ico
    # file, so answer the browser's implicit probe with 204 instead of a 404.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # ─── Secret view + create result pages — no caching anywhere ─────────
    location ~ ^/(s|created)/ {
        limit_req zone=shh_general burst=20 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Everything else — Next.js ───────────────────────────────────────
    location / {
        limit_req zone=shh_general burst=20 nodelay;
        proxy_pass http://shh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
