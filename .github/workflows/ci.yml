name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 compiles from source when no prebuilt binary matches.
      - run: npm ci

      - run: npx eslint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      - name: Audit production dependencies
        # Dev-only advisories shouldn't fail a PR, but anything shipped to a
        # running instance should.
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Native arch only — this is a smoke test, not the release build.
      # .github/workflows/docker-publish.yml does the multi-arch push.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shh:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      # The interesting failure mode is a container that starts but can't write
      # its database, so exercise a real create/reveal round trip rather than
      # just checking the process is up.
      - name: Run and exercise the container
        run: |
          mkdir -p /tmp/shh-data && chmod 777 /tmp/shh-data
          docker run -d --name shh -p 3000:3000 \
            -v /tmp/shh-data:/data \
            -e SHH_BASE_URL=https://shh.example.com \
            shh:ci

          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/api/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "never became healthy"; docker logs shh; exit 1; fi
            sleep 2
          done

          echo "--- health ---"
          curl -fsS localhost:3000/api/health

          echo "--- create ---"
          CREATED=$(curl -fsS -X POST localhost:3000/api/v1/secrets \
            -H 'Content-Type: application/json' \
            -d '{"plaintext":"ci-secret","expiry":"first_view"}')
          echo "$CREATED"
          ID=$(echo "$CREATED" | jq -r .id)
          KEY=$(echo "$CREATED" | jq -r .key)

          echo "--- reveal ---"
          GOT=$(curl -fsS -X POST "localhost:3000/api/v1/secrets/$ID/reveal" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg k "$KEY" '{key:$k}')" | jq -r .plaintext)
          [ "$GOT" = "ci-secret" ] || { echo "round trip failed: got '$GOT'"; docker logs shh; exit 1; }

          echo "--- burn-on-read enforced ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "localhost:3000/api/v1/secrets/$ID/reveal" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg k "$KEY" '{key:$k}')")
          [ "$CODE" = "404" ] || { echo "second reveal returned $CODE, expected 404"; exit 1; }

          echo "--- data actually persisted to the mounted volume ---"
          ls -l /tmp/shh-data/secrets.db

          echo "--- container runs as non-root ---"
          UID_IN=$(docker exec shh id -u)
          [ "$UID_IN" = "1000" ] || { echo "expected uid 1000, got $UID_IN"; exit 1; }

          echo "OK"

      - name: Container logs
        if: always()
        run: docker logs shh || true
